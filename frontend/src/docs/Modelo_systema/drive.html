<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive – Meu Drive</title>
<style>
:root{
  --bg:#f8fafd; --surface:#fff; --text:#1f1f1f; --muted:#5f6368;
  --blue:#0b57d0; --blue-bg:#c2e7ff; --hover:#e9eef6; --line:#dadce0;
  --search:#e9eef6; --new:#c2e7ff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#131314;--surface:#1e1f20;--text:#e3e3e3;--muted:#c4c7c5;--blue:#a8c7fa;
  --blue-bg:#0842a0;--hover:#2a2b2c;--line:#444746;--search:#282a2c;--new:#0842a0}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover)}

/* Cabeçalho */
header{display:flex;align-items:center;gap:8px;padding:8px 16px;height:64px}
.brand{display:flex;align-items:center;gap:8px;width:240px;font-size:22px;color:var(--muted)}
.logo{width:40px;height:40px}
.search{flex:1;max-width:720px;height:48px;background:var(--search);border-radius:24px;display:flex;align-items:center;padding:0 8px;gap:4px;color:var(--muted)}
.search:focus-within{background:var(--surface);box-shadow:0 1px 3px rgba(60,64,67,.3)}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--text)}
.spacer{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:#1a73e8;color:#fff;display:grid;place-items:center;font-weight:500;margin-left:8px}

.layout{flex:1;display:flex;min-height:0}

/* Barra lateral */
aside{width:256px;padding:8px 12px;overflow:auto;flex:none}
.new-btn{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px 0 16px;margin:8px 0 16px;background:var(--new);border-radius:16px;font-weight:500;font-size:14px;box-shadow:0 1px 2px rgba(60,64,67,.3)}
.new-btn:hover{box-shadow:0 2px 6px rgba(60,64,67,.35)}
nav a{display:flex;align-items:center;gap:16px;height:32px;padding:0 12px 0 20px;border-radius:0 16px 16px 0;margin-right:-12px;color:var(--text);text-decoration:none;height:34px;border-radius:17px;margin:0}
nav a:hover{background:var(--hover)}
nav a.active{background:var(--blue-bg);font-weight:600;color:var(--text)}
nav a svg{color:var(--muted)}
nav a.active svg{color:var(--text)}
nav hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.storage{padding:8px 20px;color:var(--muted);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;width:62%;height:100%;background:var(--blue)}
.storage button{margin-top:10px;border:1px solid var(--line);border-radius:18px;padding:8px 16px;color:var(--blue);font-weight:500}
.storage button:hover{background:var(--hover)}

/* Conteúdo */
main{flex:1;background:var(--surface);border-radius:16px;margin:0 16px 16px 0;padding:0 24px 24px;overflow:auto}
.toolbar{display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;background:var(--surface);z-index:1}
.toolbar h1{font-size:22px;font-weight:400}
.view{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.view button{width:56px;height:32px;display:grid;place-items:center;color:var(--muted)}
.view button.on{background:var(--blue-bg);color:var(--text)}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:8px}
.chip:hover{background:var(--hover)}
.chip svg{width:18px;height:18px}
h2{font-size:14px;font-weight:500;color:var(--muted);margin:16px 0 12px}

.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.folder{display:flex;align-items:center;gap:12px;height:48px;padding:0 8px 0 16px;background:var(--bg);border:1px solid transparent;border-radius:12px;font-weight:500}
.folder:hover{background:var(--hover)}
.folder svg{color:var(--muted)}
.folder span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--bg);border-radius:12px;overflow:hidden;border:1px solid transparent;cursor:pointer}
.card:hover{background:var(--hover)}
.card .name{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 16px;font-weight:500}
.card .name span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .thumb{margin:0 8px 8px;height:140px;border-radius:8px;background:var(--surface);display:grid;place-items:center}
.thumb svg{width:56px;height:56px}
.card.sel{background:var(--blue-bg)}
.t-doc{color:#4285f4}.t-sheet{color:#0f9d58}.t-slide{color:#f4b400}.t-pdf{color:#d93025}.t-img{color:#d93025}

/* Lista */
.list{display:none;width:100%;border-collapse:collapse}
.list th{text-align:left;font-weight:500;color:var(--muted);padding:12px 8px;border-bottom:1px solid var(--line)}
.list td{padding:0 8px;height:48px;border-bottom:1px solid var(--line);color:var(--muted)}
.list td:first-child{color:var(--text);font-weight:500}
.list td:first-child div{display:flex;align-items:center;gap:16px}
.list tr:hover td{background:var(--hover)}
body.lista .files{display:none}
body.lista .list{display:table}

@media (max-width:800px){
  aside,.brand span{display:none}.brand{width:auto}
  main{margin:0;border-radius:0;padding:0 12px 16px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24"><path fill="#0066da" d="m3.5 18.5 1.4 2.4c.3.5.7.9 1.2 1.2l4.3-7.4H2.4c0 .5.1 1.1.4 1.6z"/><path fill="#00ac47" d="M12 8.2 7.7.8c-.5.3-.9.7-1.2 1.2L.4 12.600c-.3.5-.4 1.100-.4 1.600h8.600z"/><path fill="#ea4335" d="M20.200 22.100c.5-.3.9-.7 1.200-1.200l.6-1 2.100-3.600c.3-.5.4-1.100.4-1.600h-8.600l1.800 3.300z"/><path fill="#00832d" d="M12 8.200 16.300.8c-.5-.3-1.100-.4-1.700-.4H9.400c-.6 0-1.200.2-1.700.4z"/><path fill="#2684fc" d="M15.400 14.200H8.600l-4.300 7.400c.5.3 1.100.4 1.700.4h12c.6 0 1.200-.2 1.700-.4z"/><path fill="#ffba00" d="m20.100 7.300-3.800-6.500c-.5.3-.9.700-1.200 1.200l-3.100 5.300 3.400 6h8.600c0-.5-.1-1.100-.4-1.600z"/></svg>
    <span>Drive</span>
  </div>
  <label class="search">
    <span class="icon-btn"><svg viewBox="0 0 24 24"><path d="M15.500 14h-.8l-.3-.3A6.500 6.500 0 1 0 14 15.500l.3.3v.8l5 5 1.500-1.500zm-6 0a4.500 4.500 0 1 1 0-9 4.500 4.500 0 0 1 0 9z"/></svg></span>
    <input type="search" placeholder="Pesquisar no Drive" aria-label="Pesquisar no Drive" id="q">
    <span class="icon-btn"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2zM3 5v2h10V5zm10 16v-2h8v-2h-8v-2h-2v6zM7 9v2H3v2h4v2h2V9zm14 4v-2H11v2zm-6-4h2V7h4V5h-4V3h-2z"/></svg></span>
  </label>
  <div class="spacer"></div>
  <button class="icon-btn" aria-label="Ajuda"><svg viewBox="0 0 24 24"><path d="M11 18h2v-2h-2zm1-16a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-14a4 4 0 0 0-4 4h2a2 2 0 1 1 4 0c0 2-3 1.800-3 5h2c0-2.200 3-2.500 3-5a4 4 0 0 0-4-4z"/></svg></button>
  <button class="icon-btn" aria-label="Configurações"><svg viewBox="0 0 24 24"><path d="M19.400 13a7.500 7.500 0 0 0 0-2l2.100-1.600-2-3.500-2.500 1a7.300 7.300 0 0 0-1.700-1L15 3.200h-4l-.4 2.700a7.300 7.300 0 0 0-1.700 1l-2.500-1-2 3.500L6.600 11a7.500 7.500 0 0 0 0 2l-2.100 1.600 2 3.500 2.500-1c.5.400 1.100.7 1.700 1l.4 2.700h4l.4-2.700c.6-.3 1.200-.6 1.700-1l2.500 1 2-3.500zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></button>
  <div class="avatar" title="Conta">M</div>
</header>

<div class="layout">
<aside>
  <button class="new-btn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>Novo</button>
  <nav>
    <a href="#" class="active"><svg viewBox="0 0 24 24"><path d="M19 2H5a2 2 0 0 0-2 2l-.010 16 .010.1.1.4.2.3 3 3 .4.1H19a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM8 9l4-6 4 6zm-3 2h14v8H5z" opacity=".0"/><path d="m7.700 3-5.400 9.400 2.700 4.600 5.400-9.400zm1.300 0 5.400 9.300H20L14.600 3zm10.900 11h-10.700L6.400 19.500H17.200z"/></svg>Meu Drive</a>
  <a href="#"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" opacity="0"/><path d="M20 18c1.100 0 2-.9 2-2V6c0-1.100-.9-2-2-2H4c-1.100 0-2 .9-2 2v10c0 1.100.9 2 2 2H0v2h24v-2zM4 6h16v10H4z"/></svg>Computadores</a>
  <a href="#"><svg viewBox="0 0 24 24"><path d="M16 11c1.700 0 3-1.300 3-3s-1.300-3-3-3-3 1.300-3 3 1.300 3 3 3zm-8 0c1.700 0 3-1.300 3-3S9.700 5 8 5 5 6.300 5 8s1.300 3 3 3zm0 2c-2.300 0-7 1.200-7 3.500V19h14v-2.500C15 14.200 10.300 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.200.8 2 2 2 3.400V19h6v-2.500c0-2.300-4.700-3.500-7-3.500z"/></svg>Compartilhados comigo</a>
  <a href="#"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.200 3.200.8-1.300-4.500-2.700z"/></svg>Recentes</a>
  <a href="#"><svg viewBox="0 0 24 24"><path d="m12 17.300 6.200 3.700-1.600-7L22 9.200l-7.200-.6L12 2 9.200 8.600 2 9.200 7.400 14l-1.600 7z"/></svg>Com estrela</a>
  <hr>
  <a href="#"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.100.9 2 2 2h8c1.100 0 2-.9 2-2V7H6zM19 4h-3.500l-1-1h-5l-1 1H5v2h14z"/></svg>Lixeira</a>
  <a href="#"><svg viewBox="0 0 24 24"><path d="M19.400 10a7.500 7.500 0 0 0-14.800 0A5.500 5.500 0 0 0 6 21h13a4.500 4.500 0 0 0 .4-9z"/></svg>Armazenamento</a>
  <div class="storage">
    <div class="bar"><i></i></div>
    9,3 GB de 15 GB usados
    <br><button>Receber mais armazenamento</button>
  </div>
</aside>

<main>
  <div class="toolbar">
    <h1>Meu Drive</h1>
    <div class="view" role="group" aria-label="Modo de visualização">
      <button id="bList" aria-label="Lista"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/></svg></button>
      <button id="bGrid" class="on" aria-label="Grade"><svg viewBox="0 0 24 24"><path d="M3 3v8h8V3zm6 6H5V5h4zm-6 4v8h8v-8zm6 6H5v-4h4zm4-16v8h8V3zm6 6h-4V5h4zm-6 4v8h8v-8zm6 6h-4v-4h4z"/></svg></button>
    </div>
  </div>

  <div class="filters">
    <button class="chip">Tipo <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5z"/></svg></button>
    <button class="chip">Pessoas <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5z"/></svg></button>
    <button class="chip">Modificado <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5z"/></svg></button>
    <button class="chip">Origem <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5z"/></svg></button>
  </div>

  <h2>Pastas</h2>
  <div class="folders" id="folders"></div>

  <h2>Arquivos</h2>
  <div class="files" id="files"></div>
  <table class="list" id="list">
    <thead><tr><th>Nome</th><th>Proprietário</th><th>Última modificação</th><th>Tamanho</th></tr></thead>
    <tbody></tbody>
  </table>
</main>
</div>

<script>
const ico={
 folder:'<svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg>',
 file:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.500L18.500 9zM8 13h8v2H8zm0 4h8v2H8z"/></svg>',
 more:'<svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>'
};
const folders=["Faculdade","Fotos de viagem","Projetos","Contratos","Receitas","Trabalho"];
const files=[
 ["Relatório trimestral","t-doc","Eu","12 out 2026","148 KB"],
 ["Orçamento 2026","t-sheet","Eu","10 out 2026","86 KB"],
 ["Apresentação do projeto","t-slide","Ana Costa","8 out 2026","2,4 MB"],
 ["Contrato de serviço.pdf","t-pdf","Eu","3 out 2026","512 KB"],
 ["Foto-praia.jpg","t-img","Eu","28 set 2026","3,1 MB"],
 ["Lista de tarefas","t-doc","Eu","21 set 2026","24 KB"],
 ["Controle de despesas","t-sheet","Carlos M.","15 set 2026","64 KB"],
 ["Plano de aula","t-doc","Eu","2 set 2026","42 KB"]
];
document.getElementById('folders').innerHTML=folders.map(f=>
 `<div class="folder" tabindex="0">${ico.folder}<span>${f}</span><button class="icon-btn" aria-label="Mais ações">${ico.more}</button></div>`).join('');
document.getElementById('files').innerHTML=files.map(f=>
 `<div class="card" tabindex="0" data-n="${f[0].toLowerCase()}"><div class="name"><span class="${f[1]}">${ico.file}</span><span>${f[0]}</span><button class="icon-btn" aria-label="Mais ações">${ico.more}</button></div><div class="thumb ${f[1]}">${ico.file}</div></div>`).join('');
document.querySelector('#list tbody').innerHTML=files.map(f=>
 `<tr data-n="${f[0].toLowerCase()}"><td><div><span class="${f[1]}">${ico.file}</span>${f[0]}</div></td><td>${f[2]}</td><td>${f[3]}</td><td>${f[4]}</td></tr>`).join('');

document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
 document.querySelectorAll('.card.sel').forEach(x=>x!==c&&x.classList.remove('sel'));c.classList.toggle('sel')}));
const bL=document.getElementById('bList'),bG=document.getElementById('bGrid');
function modo(l){document.body.classList.toggle('lista',l);bL.classList.toggle('on',l);bG.classList.toggle('on',!l)}
bL.onclick=()=>modo(true);bG.onclick=()=>modo(false);
document.getElementById('q').addEventListener('input',e=>{
 const v=e.target.value.toLowerCase();
 document.querySelectorAll('[data-n]').forEach(el=>el.style.display=el.dataset.n.includes(v)?'':'none');
});
</script>
</body>
</html>
