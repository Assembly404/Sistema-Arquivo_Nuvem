services:
  - type: web
    name: cloudsystem-backend
    runtime: docker
    plan: free
    rootDir: cloudsystem
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: cloudsystem-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cloudsystem-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: cloudsystem-db
          property: databaseName
      - key: DB_USERNAME
        fromDatabase:
          name: cloudsystem-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cloudsystem-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: CLOUD_MASTER_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ENABLED
        value: "true"
      - key: MAIL_ENABLED
        value: "false"
      - key: PORT
        value: "5000"

databases:
  - name: cloudsystem-db
    plan: free
    databaseName: storagearchivedb
