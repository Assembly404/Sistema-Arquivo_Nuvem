# Configuração do agente CloudSystem (nó pessoal de armazenamento)
# Este ficheiro é usado quando executas: java -jar cloudsystem-node.jar
# Podes passar qualquer uma destas propriedades por argumento:
#   java -jar cloudsystem-node.jar --cloud.node.server-url=https://...

# Servidor CloudSystem central
cloud.node.server-url=${CLOUD_SERVER_URL:https://cloudsystem-backend.onrender.com}

# Porto local onde o agente serve as réplicas
cloud.node.server-port=${NODE_PORT:8081}

# Endereço de bind (0.0.0.0 = todos os interfaces; 127.0.0.1 = só local)
cloud.node.server-address=${NODE_ADDRESS:0.0.0.0}

# Registo automático no servidor no arranque
cloud.node.auto-register=${NODE_AUTO_REGISTER:true}

# Código de pareamento (obtido em Definições → Dispositivos → Adicionar)
cloud.node.pairing-code=${NODE_PAIRING_CODE:}

# Quota em bytes (0 = usar espaço livre do disco)
# Exemplos: 107374182400 = 100GB, 53687091200 = 50GB, 0 = ilimitado
cloud.node.quota-bytes=${NODE_QUOTA_BYTES:0}

# Pasta local onde o agente guarda os ficheiros replicados
cloud.node.storage-dir=${NODE_STORAGE_DIR:./cloudstorage}

# Nome apresentado na lista de dispositivos
cloud.node.name=${NODE_NAME:}

# Endereço público pelo qual o SERVIDOR central alcança este computador.
# Obrigatório quando o servidor está na nuvem e o PC está atrás de NAT:
#   - túnel cloudflared/ngrok -> ex.: https://meu-pc.trycloudflare.com
#   - IP público + porta      -> ex.: http://203.0.113.10:8081
# Se ficar vazio, anuncia o IP local (funciona apenas em LAN/dev).
cloud.node.public-url=${NODE_PUBLIC_URL:https://kjwnzm6x-8081.uks1.devtunnels.ms/}

# Actuator desligado neste modo
management.endpoints.enabled=false

# Logging simples
logging.level.root=INFO
logging.level.com.assemblyproject=INFO
logging.pattern.console=%d{HH:mm:ss} %msg%n
