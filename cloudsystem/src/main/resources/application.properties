spring.application.name=cloudsystem
server.port=5000

# Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/storagearchivedb
spring.datasource.username=postgres
spring.datasource.password=System.out.print
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true