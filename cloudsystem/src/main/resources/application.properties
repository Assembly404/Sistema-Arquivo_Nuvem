spring.application.name=cloudsystem
spring.config.import=optional:file:.env[.properties]
server.address=0.0.0.0
server.port=5000

# Actuator desativado — health check custom em /api/health
management.endpoints.enabled=false

# Database PostgreSQL
# NUNCA colocar credenciais reais aqui. Definir via variaveis de ambiente em producao.
# Em produção (Render): DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD vêm da BD do Render.
# Em dev local: usa DB_URL completo ou defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:storagearchivedb}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Email (OTP) — configure via env em produção
app.mail.enabled=${MAIL_ENABLED:false}
# Em dev, permite ver o codigo OTP no log quando o envio real esta desativado.
app.mail.dev-log-otp=${MAIL_DEV_LOG_OTP:false}
app.mail.from=Arquivo Nuvem <no-reply@arquivonuvem.local>
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Container config (armazenamento de ficheiros)
cloud.container.extension=.dbs
# Master key AES (Base64) — DEVE descodificar para 16/24/32 bytes.
# Obrigatoria: definir via CLOUD_MASTER_KEY (env) ou no .env local. Nunca no git.
cloud.container.master-key=${CLOUD_MASTER_KEY:}
cloud.container.storage-dir=./containers
cloud.container.magic=DBS1

# JWT — Obrigatorio: definir via JWT_SECRET (env) ou no .env local. Nunca no git.
# Minimo 32 caracteres (HMAC256).
security.jwt.secret=${JWT_SECRET:}

# Nós de armazenamento
cloud.node.storage-dir=./node-storage
cloud.node.server-port=8081
cloud.node.server-address=0.0.0.0
# Nuvem oficial do sistema (nó interno sempre disponível). 0 = ilimitado.
cloud.node.system-node-name=${SYSTEM_NODE_NAME:Nuvem do sistema}
cloud.node.system-quota-bytes=${SYSTEM_QUOTA_BYTES:0}
# Validade dos códigos de pareamento de dispositivos (RF17.4).
cloud.node.pairing-ttl-minutes=${PAIRING_TTL_MINUTES:15}

# Lixeira (RF11) — prazo de retenção e periodicidade da limpeza automática.
cloud.trash.retention-days=${TRASH_RETENTION_DAYS:30}
cloud.trash.cleanup-cron=${TRASH_CLEANUP_CRON:0 0 3 * * *}